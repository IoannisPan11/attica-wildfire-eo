[project]
name = "attica-wildfire-eo"
version = "0.1.0"
description = "Satellite-based burn severity assessment of the 2024 Varnavas wildfire in Attica, Greece."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=2.2,<3",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.1",
    "rioxarray>=0.23.0",
    "shapely>=2.1.2",
    "stackstac>=0.5.1",
    "xarray>=2026.7.0",
]
